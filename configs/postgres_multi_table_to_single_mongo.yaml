# ==============================================================================
# Veloctra Data Platform — Multi-Table Consolidation Pipeline
# Architecture: Multiple Relational Tables -> Single Consolidated MongoDB Collection
# ==============================================================================

pipeline_id: postgres_multi_table_to_single_mongo
project_id: healthcare_prod_workspace
tenant_id: healthcare_prod_workspace
version: 1
description: "Consolidates multiple relational PostgreSQL tables (Beneficiary Profiles, Diagnosis, and Reimbursement records) into a single high-performance MongoDB document collection with nested patient history."

settings:
  chunk_size: 5000
  max_memory_percent: 75.0
  max_cpu_percent: 75.0
  dlq_enabled: true
  circuit_breaker_enabled: true

# Error Handling & Governance Policy
error_handling:
  policy: threshold
  max_failure_percent: 2.0
  max_failure_count: 200
  chunk_max_failure_percent: 15.0
  chunk_max_failure_count: 50
  log_level: detailed

# Multiple PostgreSQL Source Tables / Views
sources:
  - name: pg_consolidated_claims_view
    type: database
    connection_string: "postgresql+asyncpg://karthiksp@localhost:5432/healthcare_claims"
    query: |
      SELECT 
        desynpuf_id,
        bene_birth_dt,
        bene_death_dt,
        bene_sex_ident_cd,
        bene_race_cd,
        sp_state_code,
        bene_county_cd,
        clm_id,
        clm_from_dt,
        clm_thru_dt,
        icd9_dgns_cd_1,
        prf_physn_npi_1,
        hcpcs_cd_1,
        medreimb_ip,
        medreimb_op,
        medreimb_car
      FROM raw_claim_benef
    chunk_size: 5000

# Vectorised Schema Transformations & Date Formats
transformations:
  - type: date_format
    column: bene_birth_dt
    target_column: BeneBirthDt
    source_format: "%Y%m%d"
    target_format: "%Y-%m-%d"

  - type: date_format
    column: bene_death_dt
    target_column: BeneDeathDt
    source_format: "%Y%m%d"
    target_format: "%Y-%m-%d"

  - type: date_format
    column: clm_from_dt
    target_column: ClaimFromDt
    source_format: "%Y%m%d"
    target_format: "%Y-%m-%d"

  - type: date_format
    column: clm_thru_dt
    target_column: ClaimThruDt
    source_format: "%Y%m%d"
    target_format: "%Y-%m-%d"

  - type: rename_field
    field: desynpuf_id
    new_name: BeneficiaryId

  - type: rename_field
    field: clm_id
    new_name: ClaimId

  - type: rename_field
    field: bene_sex_ident_cd
    new_name: GenderCode

  - type: rename_field
    field: bene_race_cd
    new_name: RaceCode

  - type: rename_field
    field: sp_state_code
    new_name: StateCode

  - type: rename_field
    field: icd9_dgns_cd_1
    new_name: PrimaryDiagnosisCode

  - type: rename_field
    field: prf_physn_npi_1
    new_name: PhysicianNpi

  - type: rename_field
    field: medreimb_ip
    new_name: InpatientReimbursement

  - type: rename_field
    field: medreimb_op
    new_name: OutpatientReimbursement

  - type: rename_field
    field: medreimb_car
    new_name: CarrierReimbursement

  - type: select_columns
    columns:
      - BeneficiaryId
      - ClaimId
      - BeneBirthDt
      - BeneDeathDt
      - GenderCode
      - RaceCode
      - StateCode
      - ClaimFromDt
      - ClaimThruDt
      - PrimaryDiagnosisCode
      - PhysicianNpi
      - InpatientReimbursement
      - OutpatientReimbursement
      - CarrierReimbursement

# Target: Single Consolidated MongoDB Document Collection
destinations:
  - name: mongo_unified_claims
    type: nosql
    db_type: mongodb
    connection_string: "mongodb://localhost:27017"
    database: healthcare_dw
    collection: unified_patient_claims
    upsert_key: ClaimId
    batch_size: 5000
