pipeline_id: csv_to_postgres
project_id: healthcare_prod_workspace
tenant_id: healthcare_prod_workspace
version: 1
description: "Streams claims and beneficiary data directly from compressed CSV zip archive into PostgreSQL with MemoryGuard governance."

settings:
  chunk_size: 10000
  max_memory_percent: 75.0
  max_cpu_percent: 75.0
  dlq_enabled: true
  circuit_breaker_enabled: true

# Error Handling & Failure Policy
error_handling:
  policy: threshold                # "continue" | "stop_on_failure" | "threshold"
  max_failure_percent: 5.0         # Per-run: halt if > 5% of total rows fail
  max_failure_count: 1000          # Per-run: OR halt if absolute DLQ count exceeds 1000
  chunk_max_failure_percent: 25.0  # Per-chunk: halt if > 25% of a single chunk fails
  chunk_max_failure_count: 200     # Per-chunk: OR halt if > 200 records fail in one chunk
  log_level: detailed              # "minimal" | "standard" | "detailed"

sources:
  - name: raw_claims_zip_file
    type: file
    format: zip
    path: "/Users/karthiksp/projects/etl-sql-nosql/test_data/archive.zip"
    inner_filename: "RawClaimBenef.csv"
    delimiter: ","
    has_header: true
    chunk_size: 10000

destinations:
  - name: pg_raw_claim_benef
    type: database
    connection_string: "postgresql+asyncpg://karthiksp@localhost:5432/healthcare_claims"
    table: raw_claim_benef
    batch_size: 10000
