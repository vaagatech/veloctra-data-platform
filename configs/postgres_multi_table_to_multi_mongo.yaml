# ==============================================================================
# Veloctra Data Platform — Multi-Destination Fan-Out Pipeline
# Architecture: PostgreSQL Tables -> Multiple Separate MongoDB Collections
# ==============================================================================

pipeline_id: postgres_multi_table_to_multi_mongo
project_id: healthcare_prod_workspace
tenant_id: healthcare_prod_workspace
version: 1
description: "Extracts healthcare data from PostgreSQL and fans out transformed records across multiple specialized MongoDB collections (patients collection and claims collection) simultaneously."

settings:
  chunk_size: 5000
  max_memory_percent: 75.0
  max_cpu_percent: 75.0
  dlq_enabled: true
  circuit_breaker_enabled: true

# Error Handling & Governance Policy
error_handling:
  policy: threshold
  max_failure_percent: 2.0
  max_failure_count: 200
  chunk_max_failure_percent: 15.0
  chunk_max_failure_count: 50
  log_level: detailed

sources:
  - name: pg_healthcare_claims
    type: database
    connection_string: "postgresql+asyncpg://karthiksp@localhost:5432/healthcare_claims"
    query: "SELECT * FROM raw_claim_benef"
    chunk_size: 5000

transformations:
  - type: date_format
    column: bene_birth_dt
    target_column: BeneBirthDt
    source_format: "%Y%m%d"
    target_format: "%Y-%m-%d"

  - type: date_format
    column: bene_death_dt
    target_column: BeneDeathDt
    source_format: "%Y%m%d"
    target_format: "%Y-%m-%d"

  - type: date_format
    column: clm_from_dt
    target_column: ClaimFromDt
    source_format: "%Y%m%d"
    target_format: "%Y-%m-%d"

  - type: date_format
    column: clm_thru_dt
    target_column: ClaimThruDt
    source_format: "%Y%m%d"
    target_format: "%Y-%m-%d"

  - type: rename_field
    field: desynpuf_id
    new_name: BeneficiaryId

  - type: rename_field
    field: clm_id
    new_name: ClaimId

  - type: rename_field
    field: bene_sex_ident_cd
    new_name: GenderCode

  - type: rename_field
    field: bene_race_cd
    new_name: RaceCode

  - type: rename_field
    field: sp_state_code
    new_name: StateCode

  - type: rename_field
    field: icd9_dgns_cd_1
    new_name: PrimaryDiagnosisCode

  - type: rename_field
    field: medreimb_ip
    new_name: InpatientReimbursement

  - type: rename_field
    field: medreimb_op
    new_name: OutpatientReimbursement

# Target Destinations: Multiple MongoDB Collections Fan-Out
destinations:
  # Destination 1: Beneficiary / Patient Demographics Collection
  - name: mongo_patient_demographics
    type: nosql
    db_type: mongodb
    connection_string: "mongodb://localhost:27017"
    database: healthcare_dw
    collection: patient_demographics
    upsert_key: BeneficiaryId
    batch_size: 5000

  # Destination 2: Clinical Claims Transaction Collection
  - name: mongo_clinical_claims
    type: nosql
    db_type: mongodb
    connection_string: "mongodb://localhost:27017"
    database: healthcare_dw
    collection: clinical_claims
    upsert_key: ClaimId
    batch_size: 5000
