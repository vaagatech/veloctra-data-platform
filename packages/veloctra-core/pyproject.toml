[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veloctra-core"
version = "1.0.0"
description = "Core settings and protocols for Veloctra Data Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "pyarrow>=17.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["veloctra_core*"]
