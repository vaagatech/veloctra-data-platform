[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veloctra-transformers"
version = "1.0.0"
description = "Vectorised PyArrow & Polars LazyFrame transformation engine with AES-256-GCM field encryption for Veloctra Data Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "veloctra-core",
    "veloctra-security",
    "veloctra-connectors",
    "pyarrow>=17.0.0",
    "polars>=1.6.0",
    "cryptography>=43.0.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["veloctra_transformers*"]
