[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veloctra-connectors"
version = "1.0.0"
description = "SQL, NoSQL, and Universal FileSystem connectors for Veloctra Data Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "veloctra-core",
    "veloctra-security",
    "veloctra-resilience",
    "pyarrow>=17.0.0",
    "asyncpg>=0.29.0",
    "aiomysql>=0.2.0",
    "aiosqlite>=0.20.0",
    "fsspec>=2024.2.0",
    "s3fs>=2024.2.0",
    "motor>=3.6.0",
    "cassandra-driver>=3.29.1",
    "boto3>=1.35.0",
    "aio_pika>=9.4.0",
    "aiokafka>=0.12.0",
    "aiobotocore>=2.15.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["veloctra_connectors*"]
