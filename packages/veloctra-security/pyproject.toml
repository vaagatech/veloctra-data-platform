[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "veloctra-security"
version = "1.0.0"
description = "Security, RBAC engine, JWT authentication, and multi-provider Vault/AWS secrets resolver"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "veloctra-core",
    "bcrypt>=4.2.0",
    "PyJWT>=2.9.0",
    "fastapi>=0.115.0",
    "hvac>=2.3.0",
    "boto3>=1.35.0",
    "cryptography>=43.0.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["veloctra_security*"]
