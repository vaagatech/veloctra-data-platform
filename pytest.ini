[pytest]
pythonpath = packages/veloctra-core packages/veloctra-security packages/veloctra-state packages/veloctra-resilience packages/veloctra-connectors packages/veloctra-transformers packages/veloctra-orchestrator packages/veloctra-api .
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = true
log_cli_level = WARNING
