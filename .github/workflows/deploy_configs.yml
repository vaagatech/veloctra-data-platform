name: Veloctra GitOps — Config CI/CD & Auto-Deployment

on:
  push:
    branches: [ main, master ]
    paths:
      - 'configs/**'
      - '.github/workflows/deploy_configs.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'configs/**'
  workflow_dispatch:
    inputs:
      workspace:
        description: 'Target Project Workspace ID'
        required: true
        default: 'healthcare_prod_workspace'
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development

jobs:
  validate-and-deploy:
    name: Validate & Sync Pipeline Configs
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Platform Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e packages/veloctra-core
          pip install -e packages/veloctra-security
          pip install -e packages/veloctra-state
          pip install -e packages/veloctra-resilience
          pip install -e packages/veloctra-connectors
          pip install -e packages/veloctra-transformers
          pip install -e packages/veloctra-orchestrator
          pip install -e packages/veloctra-api

      - name: Step 1 — Validate YAML Pipeline Configurations
        run: |
          echo "🔍 Validating all YAML configurations against Veloctra JSON Schema..."
          for cfg in configs/*.yaml; do
            echo "Checking $cfg..."
            python veloctra_cli.py validate -c "$cfg"
          done
          echo "✅ All configurations passed schema validation."

      - name: Step 2 — Import Configs & Encrypt Connections into StateStore
        env:
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY || 'H/aqc2cirGXQKmpPna+Nq9pw0g0v/BKkVNR9XBEQ1rg=' }}
          MONGO_URI: mongodb://localhost:27017
          STATE_STORE_TYPE: mongodb
          MONGO_SYSTEM_DB: veloctra_system
        run: |
          TARGET_WS="${{ github.event.inputs.workspace || 'healthcare_prod_workspace' }}"
          echo "🚀 Importing configurations into StateStore for Workspace: $TARGET_WS"
          python scripts/import_configs.py --workspace "$TARGET_WS" --name "Healthcare Workspace"

      - name: Step 3 — Post-Deployment Verification Summary
        run: |
          echo "=================================================================="
          echo " 🎉 Veloctra GitOps Sync Completed Successfully!"
          echo " Target Workspace : ${{ github.event.inputs.workspace || 'healthcare_prod_workspace' }}"
          echo " Deployment State : Active in MongoDB StateStore"
          echo "=================================================================="
