apiVersion: apps/v1
kind: Deployment
metadata:
  name: veloctra-engine
  namespace: veloctra
  labels:
    app.kubernetes.io/name: veloctra-engine
    app.kubernetes.io/part-of: veloctra-data-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: veloctra-engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: veloctra-engine
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: veloctra
          image: veloctra-data-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: veloctra-config
            - secretRef:
                name: veloctra-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "500m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 2
          volumeMounts:
            - name: state-storage
              mountPath: /app/state_data
      volumes:
        - name: state-storage
          emptyDir: {}
